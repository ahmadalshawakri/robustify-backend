name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: robustify
          POSTGRES_PASSWORD: robustify
          POSTGRES_DB: robustify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U robustify"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://robustify:robustify@localhost:5432/robustify
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters
      SEED_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @robustify/api db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations apply and the seed runs on a clean database
        run: pnpm db:deploy && pnpm db:seed

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t robustify .

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: robustify
          POSTGRES_PASSWORD: robustify
          POSTGRES_DB: robustify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U robustify"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://robustify:robustify@localhost:5432/robustify
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters
      SEED_PASSWORD: ci-password
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @robustify/api db:generate
      - run: pnpm build
      - run: pnpm db:deploy
      - run: pnpm --filter @robustify/e2e exec playwright install --with-deps chromium
      - name: Start the app in demo mode (it seeds itself)
        run: |
          WEB_DIST=../web/dist nohup node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
        working-directory: apps/api
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            apps/api/server.log
